<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慢读向量化</title>
<style>
/* ===== 《慢读向量化》 instrument aesthetic — ported from Claude Design styles.css =====
   Light app shell + dark data canvas. Single signature data-red. alpha = value*0.7. */
:root{
  --bg:#f5f5f5; --panel:#fafafa; --panel-2:#f0f0f0;
  --ink:#333; --ink-soft:#777; --ink-faint:#a3a3a3;
  --border:#ddd; --border-soft:#e6e6e6;
  --blue:#1e6fff; --blue-soft:#e8f0ff;
  --canvas:#101010; --canvas-2:#191919; --canvas-line:#2a2a2a; --canvas-line-soft:#202020;
  --canvas-ink:#c3c3c3; --canvas-ink-soft:#6f6f6f;
  --red:255,71,64;
  --mono: ui-monospace,"SF Mono","Menlo","Consolas","Liberation Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --t:0.14s cubic-bezier(.4,0,.2,1);
  /* slower, eased step-entry timing (this build's calmer pacing) */
  --enter:0.62s cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1;}
::selection{background:rgba(var(--red),.18);}

.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* top bar */
.topbar{height:50px;flex:0 0 50px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
.brand__mark{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:#fff;background:var(--ink);padding:3px 7px;border-radius:2px;white-space:nowrap;}
.brand__name{font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap;}
.brand__sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar__spacer{flex:1;}
.stepind{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.04em;white-space:nowrap;}
.stepind b{color:var(--ink);font-weight:600;}
.readouts{display:flex;gap:0;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.readout{display:flex;flex-direction:column;gap:1px;padding:5px 11px;background:var(--panel-2);border-right:1px solid var(--border);}
.readout:last-child{border-right:none;}
.readout__k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;white-space:nowrap;}
.readout__v{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600;white-space:nowrap;}
.readout__v.is-live{color:var(--blue);}
.livetoggle{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);border:1px solid var(--border);border-radius:3px;padding:5px 9px;cursor:not-allowed;user-select:none;}
.livetoggle .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
.livetoggle .pill{border:1px solid var(--border);border-radius:999px;padding:1px 6px;color:var(--ink-faint);font-size:9px;letter-spacing:.1em;}

/* body: rail + stage */
.body{flex:1;display:flex;min-height:0;}
.rail{flex:0 0 360px;width:360px;background:var(--panel);border-right:1px solid var(--border);padding:26px 26px 22px;display:flex;flex-direction:column;overflow-y:auto;}
.rail__kicker{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.rail__kicker .num{color:var(--blue);font-weight:600;}
.rail__kicker .bar{flex:1;height:1px;background:var(--border);}
.rail__title{font-size:23px;font-weight:650;letter-spacing:.01em;line-height:1.25;margin:0 0 4px;}
.rail__title .en{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-faint);font-weight:500;margin-top:7px;text-transform:uppercase;}
.rail__lead{font-size:16px;line-height:1.6;color:var(--ink);margin:18px 0 0;font-weight:500;text-wrap:pretty;}
.rail__lead b{font-weight:700;}
.rail__lead .q{color:var(--ink-soft);font-style:normal;}
.rail__body{font-size:13.5px;line-height:1.75;color:var(--ink-soft);margin:14px 0 0;text-wrap:pretty;}
.rail__body strong{color:var(--ink);font-weight:650;}
.rail__body .hl{color:var(--blue);font-weight:600;}
.rail__body .rd{color:#ff4740;font-weight:600;}
.rail__quote{border-left:2px solid var(--blue);padding:7px 0 7px 14px;margin:16px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink);font-weight:500;}
.rail__foot{margin-top:auto;padding-top:18px;}
.note{display:flex;gap:8px;align-items:flex-start;font-family:var(--mono);font-size:10.5px;line-height:1.5;letter-spacing:.01em;color:var(--ink-faint);border-top:1px dashed var(--border);padding-top:12px;}
.note .tag{color:var(--ink-soft);border:1px solid var(--border);border-radius:2px;padding:1px 5px;flex:0 0 auto;letter-spacing:.08em;}

/* stage */
.stage{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;padding:24px 28px;overflow:hidden;}
.stage__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stage__label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;white-space:nowrap;}
.stage__meta{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
.stage__meta b{color:var(--ink-soft);font-weight:600;}
.stage__inner{flex:1;min-height:0;display:flex;}

/* REALITY aside (实际情况) — calm secondary layer in the rail */
.reality{margin:18px 0 0;border-left:2px solid rgba(var(--red),.55);background:linear-gradient(90deg,rgba(var(--red),.05),transparent 80%);padding:11px 0 11px 14px;border-radius:0 3px 3px 0;}
.reality__lab{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--red),.95);margin-bottom:7px;}
.reality__lab .sq{width:6px;height:6px;background:rgb(var(--red));border-radius:1px;}
.reality__lab .en{color:var(--ink-faint);letter-spacing:.16em;}
.reality__body{font-size:12.5px;line-height:1.7;color:var(--ink-soft);text-wrap:pretty;}
.reality__body strong{color:var(--ink);font-weight:650;}
.reality__body .hl{color:var(--blue);font-weight:600;}
.reality__body em{font-style:normal;color:var(--ink);background:rgba(var(--red),.08);padding:0 3px;border-radius:2px;}
.formula{margin:9px 0 4px;padding:9px 11px;background:#fff;border:1px solid var(--border);border-radius:3px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#222;overflow-x:auto;}
.formula .lead{display:block;font-size:10px;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:4px;}
.formula sub,.formula sup{font-size:.72em;}
.formula .op{color:var(--blue);}
.formula .rng{display:block;margin-top:5px;font-size:11px;color:var(--ink-soft);}

/* ---- Cover / intro (step 0) ---- */
.cover{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 32px;overflow-y:auto;}
.cover__inner{max-width:680px;width:100%;}
.cover__kicker{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.cover__kicker .bar{flex:1;height:1px;background:var(--border);}
.cover__title{font-size:46px;font-weight:700;letter-spacing:.02em;line-height:1.1;margin:0;}
.cover__sub{font-size:19px;font-weight:500;color:var(--ink-soft);margin:14px 0 0;line-height:1.45;}
.cover__body{margin:26px 0 0;}
.cover__body p{font-size:15px;line-height:1.8;color:var(--ink);margin:0 0 14px;text-wrap:pretty;}
.cover__body p:last-child{margin-bottom:0;}
.cover__body strong{font-weight:700;}
.cover__body .hl{color:var(--blue);font-weight:650;}
.cover__pipe{font-family:var(--mono);color:var(--blue);font-size:14px;letter-spacing:.02em;}
.cover__note{margin:24px 0 0;display:flex;gap:10px;align-items:flex-start;font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--ink-faint);border:1px dashed var(--border);border-radius:4px;padding:12px 14px;background:var(--panel-2);}
.cover__note .tag{flex:0 0 auto;color:var(--ink-soft);border:1px solid var(--border);border-radius:2px;padding:1px 6px;letter-spacing:.08em;}
.cover__note strong{color:var(--ink-soft);font-weight:650;}
.cover__cta{margin:28px 0 0;}
.cover__cta button{font-family:var(--sans);font-size:15px;font-weight:600;padding:13px 30px;border-radius:3px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;transition:background var(--t);}
.cover__cta button:hover{background:#1862e6;}

/* document panel */
.docpanel{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:4px;padding:8px 0;}
.doc-text{font-size:15px;line-height:1.7;color:var(--ink);}
.doc-text .num{font-family:var(--mono);font-size:13.5px;color:#222;}
.docfoot{flex:0 0 auto;padding:10px 4px 0;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);display:flex;align-items:center;gap:8px;}
.docfoot .lic{border:1px solid var(--border);border-radius:2px;padding:1px 6px;letter-spacing:.06em;}

/* chunk grid */
.chunkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;width:100%;}
.chunk{background:#fff;border:1px solid var(--border);border-radius:4px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateY(8px);animation:chunkIn var(--enter) forwards;}
@keyframes chunkIn{to{opacity:1;transform:none;}}
.chunk__id{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--blue);font-weight:600;}
.chunk__t{font-size:13px;line-height:1.55;color:var(--ink);}
.chunk__t .num{font-family:var(--mono);font-size:12px;}

/* tokenization */
.tokwrap{flex:1;display:flex;flex-direction:column;gap:0;min-height:0;}
.tokline{background:#fff;border:1px solid var(--border);border-radius:4px;padding:26px 28px;line-height:2.6;font-size:21px;display:flex;flex-wrap:wrap;gap:7px 7px;align-content:flex-start;}
.tok{position:relative;display:inline-flex;align-items:center;padding:5px 9px;border-radius:3px;border:1px solid var(--border);background:var(--panel);color:var(--ink);opacity:0;transform:translateY(6px);animation:tokIn .4s cubic-bezier(.22,.61,.36,1) forwards;}
.tok.is-num{background:#fff;border-color:#d6d6d6;}
.tok.is-num .tok__t{font-family:var(--mono);}
.tok.is-punct{background:transparent;border-color:transparent;color:var(--ink-faint);padding:5px 2px;}
.tok__t{font-size:21px;}
.tok__i{position:absolute;top:-8px;right:-4px;font-family:var(--mono);font-size:8px;color:var(--ink-faint);background:var(--panel);padding:0 2px;}
@keyframes tokIn{to{opacity:1;transform:none;}}

/* dark data canvas */
.canvas{flex:1;min-height:0;position:relative;background:var(--canvas);border:1px solid #000;border-radius:4px;overflow:hidden;color:var(--canvas-ink);
  background-image:linear-gradient(var(--canvas-line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--canvas-line-soft) 1px,transparent 1px);background-size:34px 34px;}
.canvas__corner{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--canvas-ink-soft);z-index:5;}
.canvas__corner.tl{top:12px;left:14px;} .canvas__corner.tr{top:12px;right:14px;text-align:right;}
.canvas__corner.bl{bottom:12px;left:14px;} .canvas__corner.br{bottom:12px;right:14px;text-align:right;}

/* co-occurrence (4a) */
.cograph-wrap{display:flex;gap:18px;width:100%;height:100%;}
.cocol{flex:1;display:flex;flex-direction:column;min-width:0;}
.cocol__head{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cocol__head .swatch{width:9px;height:9px;border-radius:50%;}
.cocol__svg{flex:1;min-height:0;}
.evid{font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#6f6f6f;margin-top:8px;}
.evid .cid{color:#4a4a4a;margin-right:8px;}

/* masked guess (4b) */
.guess{display:flex;flex-direction:column;gap:18px;width:100%;height:100%;justify-content:center;align-items:center;padding:20px;}
.guess__sentence{font-size:22px;line-height:2;color:var(--canvas-ink);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:760px;text-align:center;}
.guess__sentence .w{color:#7e7e7e;}
.guess__blank{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:40px;border:1px dashed #444;border-radius:3px;font-family:var(--mono);color:#fff;background:#000;position:relative;transition:border-color .3s;}
.guess__blank.is-filled{border-style:solid;border-color:rgba(var(--red),.7);}
.candbars{width:100%;max-width:560px;display:flex;flex-direction:column;gap:7px;}
.cand{display:grid;grid-template-columns:96px 1fr 56px;align-items:center;gap:12px;}
.cand__w{font-family:var(--mono);font-size:14px;color:var(--canvas-ink);text-align:right;}
.cand__track{height:18px;background:var(--canvas-2);border:1px solid var(--canvas-line);border-radius:2px;overflow:hidden;}
.cand__fill{height:100%;background:rgb(var(--red));width:0;transition:width .55s cubic-bezier(.22,.61,.36,1);}
.cand__p{font-family:var(--mono);font-size:12px;color:var(--canvas-ink-soft);}
.cand.is-top .cand__w{color:#fff;font-weight:600;}
.cand.is-top .cand__p{color:#fff;}

/* heatmap rows (4c) */
.heatwrap{display:flex;flex-direction:column;gap:22px;width:100%;height:100%;justify-content:center;padding:24px 30px;}
.heatrow{display:flex;flex-direction:column;gap:8px;}
.heatrow__label{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--canvas-ink-soft);}
.heatrow__label .name{color:var(--canvas-ink);}
.heatrow__label .name .tag{color:var(--blue);margin-right:8px;}
.heat-canvas{width:100%;height:46px;display:block;border:1px solid var(--canvas-line);border-radius:2px;background:#000;}
.heataxis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:#4a4a4a;margin-top:-2px;}
.heatsim{align-self:center;font-family:var(--mono);font-size:12px;color:var(--canvas-ink);border:1px solid var(--canvas-line);border-radius:3px;padding:6px 14px;background:var(--canvas-2);letter-spacing:.04em;}
.heatsim b{color:rgb(var(--red));}

/* scatter / 2D map */
.scatter-host{width:100%;height:100%;position:relative;}
.scatter-host svg{display:block;}
.scatter-tip{position:absolute;z-index:20;pointer-events:none;background:#000;border:1px solid rgba(var(--red),.6);border-radius:3px;padding:8px 11px;max-width:300px;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--canvas-ink);box-shadow:0 6px 24px rgba(0,0,0,.5);display:none;}
.scatter-tip .coord{color:#fff;}
.scatter-tip .txt{color:var(--canvas-ink-soft);margin-top:4px;font-size:11px;}

/* index matrix (step5) */
.idx-wrap{display:flex;gap:18px;width:100%;height:100%;}
.idx-col{display:flex;flex-direction:column;min-width:0;min-height:0;}
.idx-col__head{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:8px;}
.matrix{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0;flex:1;padding-right:4px;}
.matrix__row{display:flex;align-items:center;gap:8px;}
.matrix__id{font-family:var(--mono);font-size:10px;color:var(--blue);width:30px;flex:0 0 30px;}
.matrix__cells{flex:1;height:15px;display:block;border:1px solid var(--canvas-line);border-radius:1px;background:#000;}

/* prompt assembly + answer (step8) */
.gen{display:flex;flex-direction:column;gap:12px;width:100%;height:100%;padding:18px 22px;overflow-y:auto;}
.asm{display:flex;flex-direction:column;gap:9px;}
.blk{font-family:var(--mono);font-size:12px;line-height:1.6;border:1px solid var(--canvas-line);border-radius:3px;padding:10px 13px;background:var(--canvas-2);color:var(--canvas-ink);opacity:0;transform:translateY(8px);transition:opacity var(--enter),transform var(--enter);}
.blk.in{opacity:1;transform:none;}
.blk .bh{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--blue);margin-bottom:4px;text-transform:uppercase;}
.blk.sys{color:var(--canvas-ink-soft);}
.blk.ctx{border-color:rgba(var(--red),.5);}
.blk.q{border-color:var(--blue);}
.answer-box{margin-top:6px;border:1px solid rgba(var(--red),.55);border-radius:3px;background:#000;padding:14px 16px;font-family:var(--mono);font-size:15px;line-height:1.7;color:#fff;min-height:24px;opacity:0;transition:opacity var(--enter);}
.answer-box.in{opacity:1;}
.answer-box .cur{color:#666;}
.rag-note{font-family:var(--mono);font-size:11px;color:var(--canvas-ink-soft);}
.rag-note b{color:rgb(var(--red));}

/* ranking table (step7) */
.rank{width:100%;}
.rank__row{display:grid;grid-template-columns:118px 1fr 46px;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--canvas-line-soft);}
.rank__lbl{font-family:var(--sans);font-size:12.5px;color:var(--canvas-ink);white-space:nowrap;}
.rank__track{height:11px;background:var(--canvas-2);border:1px solid var(--canvas-line);border-radius:2px;overflow:hidden;}
.rank__fill{height:100%;background:rgb(var(--red));transition:width var(--t);}
.rank__p{font-family:var(--mono);font-size:11.5px;color:var(--canvas-ink-soft);text-align:right;}
.rank__row.is-top .rank__lbl{color:#fff;font-weight:600;}
.rank__row.is-top .rank__p{color:#fff;}
.maphint{font-family:var(--mono);font-size:10.5px;color:var(--canvas-ink-soft);display:flex;align-items:center;gap:12px;}
.reset-chip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--canvas-ink-soft);border:1px solid var(--canvas-line);border-radius:3px;padding:4px 9px;cursor:pointer;background:var(--canvas-2);transition:color var(--t),border-color var(--t);}
.reset-chip:hover{color:#fff;border-color:#444;}

/* pipeline (step6) */
.pipe{display:flex;flex-direction:column;gap:14px;width:100%;height:100%;justify-content:center;padding:24px 30px;}
.pipe__row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.pipe__box{font-family:var(--mono);font-size:12.5px;border:1px solid var(--canvas-line);border-radius:3px;padding:11px 15px;background:var(--canvas-2);color:var(--canvas-ink);opacity:0;transform:translateY(8px);transition:opacity var(--enter),transform var(--enter);}
.pipe__box.in{opacity:1;transform:none;}
.pipe__box .bh{display:block;font-size:9px;letter-spacing:.1em;color:var(--blue);margin-bottom:4px;text-transform:uppercase;}
.pipe__box.qcoord{border-color:var(--blue);color:#bcd2ff;}
.pipe__arrow{font-family:var(--mono);color:var(--canvas-ink-soft);font-size:18px;opacity:0;transition:opacity var(--enter);}
.pipe__arrow.in{opacity:1;}

/* footer nav */
.footer{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--panel);border-top:1px solid var(--border);}
.nav-btn{font-family:var(--sans);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:3px;border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer;transition:background var(--t),border-color var(--t),color var(--t),opacity var(--t);}
.nav-btn:hover:not(:disabled){background:var(--panel-2);}
.nav-btn:disabled{opacity:.4;cursor:not-allowed;}
.nav-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.nav-btn.primary:hover:not(:disabled){background:#1862e6;}
.nav-btn .k{font-family:var(--mono);font-size:14px;line-height:1;}
.nav-btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft);}
.nav-btn.ghost:hover:not(:disabled){background:var(--panel-2);color:var(--ink);}
.progress{flex:1;display:flex;align-items:center;gap:3px;}
.seg{flex:1;height:4px;border-radius:2px;background:var(--border);position:relative;overflow:hidden;cursor:pointer;transition:background var(--t);}
.seg .fill{position:absolute;inset:0;background:var(--blue);transform-origin:left;transition:transform var(--t);}
.seg.done{background:var(--blue);}
.seglabel{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em;white-space:nowrap;min-width:140px;text-align:right;}
.seglabel b{color:var(--ink);}

/* persistent author watermark (in footer, near 上一步) */
.watermark{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);white-space:nowrap;user-select:none;display:inline-flex;align-items:center;gap:5px;}
.watermark .by{color:#c2c2c2;}
.watermark .nm{color:var(--ink-soft);font-weight:600;}
.watermark .dot{width:4px;height:4px;border-radius:50%;background:rgba(var(--red),.7);}

/* author hover popover — name-only trigger reveals the QR image (image carries all info) */
.author-trigger{position:relative;cursor:pointer;outline:none;}
.author-pop{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(4px);
  background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .14s ease,transform .14s ease,visibility .14s;z-index:60;}
.author-trigger:hover .author-pop,.author-trigger:focus .author-pop,.author-trigger:focus-within .author-pop{
  opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
.author-pop img{display:block;width:200px;height:auto;object-fit:contain;border-radius:3px;}
/* little arrow pointing down to the name */
.author-pop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#fff;filter:drop-shadow(0 1px 0 var(--border));}

.fade-step{animation:fadeStep var(--enter);}
@keyframes fadeStep{from{opacity:0;}to{opacity:1;}}
</style>

  ];

  ];

  };
  function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
  function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  function vecFor(seed,dim){
    const rnd=mulberry32(hashStr(seed)); const bumps=[];
    for(let b=0;b<7;b++) bumps.push({c:rnd()*dim,w:8+rnd()*40,a:0.45+rnd()*0.55,ph:rnd()});

const RED="255,71,64";
const redAlpha = v => `rgba(${RED},${Math.max(0,Math.min(1,v))*0.7})`;
const D = VDATA;
const sentenceOf = id => (D.chunks.find(c=>c.id===id)||{}).text || "";

/* wrap digit runs in monospace */
function withMono(text){
  return String(text).replace(/([0-9][0-9.]*)/g, '<span class="num">$1</span>');
}

/* paint a heatmap row into a <canvas> sized to its box */
function paintHeat(canvas, values, height){
  const box=canvas.parentElement; const w=box.clientWidth||600; height=height||46;
  const dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr; canvas.height=height*dpr; canvas.style.height=height+'px';
  const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,w,height);
  const n=values.length, cw=w/n;
  for(let i=0;i<n;i++){ ctx.fillStyle=redAlpha(values[i]); ctx.fillRect(i*cw,0,cw+1,height); }
}

/* ---- Scatter: real-looking 2D plot, axes/ticks/grid/titles, hover, pin, drag ----
   opts: { points:[{id,x,y,label,tone,sim,full,r}], domain, connectFrom, pinnedId,
           onPin(id), draggableId, onDrag(x,y) } */
const TICKS=[-1,-0.5,0,0.5,1];
function Scatter(host, opts){
  const o=Object.assign({domain:[-1.15,1.15], axisX:"投影维度 1", axisY:"投影维度 2"}, opts);
  let pinnedId = o.pinnedId||null;
  const tip=document.createElement('div'); tip.className='scatter-tip'; host.appendChild(tip);
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg'); svg.style.display='block'; host.appendChild(svg);
  const m={t:18,r:18,b:42,l:50};
  let dragging=false;

  function dims(){ return {W:host.clientWidth||600, H:host.clientHeight||400}; }
  const [d0,d1]=o.domain;
  function scales(W,H){
    const pw=Math.max(10,W-m.l-m.r), ph=Math.max(10,H-m.t-m.b);
    return { pw, ph,
      sx:x=>m.l+((x-d0)/(d1-d0))*pw,
      sy:y=>m.t+(1-(y-d0)/(d1-d0))*ph };
  }
  function toData(clientX,clientY){
    const r=svg.getBoundingClientRect(); const {W,H}=dims(); const {pw,ph}=scales(W,H);
    const px=clientX-r.left, py=clientY-r.top;
    let x=d0+((px-m.l)/pw)*(d1-d0), y=d0+(1-(py-m.t)/ph)*(d1-d0);
    return { x:Math.max(d0,Math.min(d1,x)), y:Math.max(d0,Math.min(d1,y)) };
  }
  function fillFor(p){ return p.tone==="red"?`rgba(${RED},0.85)`:p.tone==="blue"?"#1e6fff":"#8a8a8a"; }
  function strokeFor(p){ return p.tone==="red"?"#ff4740":p.tone==="blue"?"#5d96ff":"#b5b5b5"; }

  function draw(){
    const {W,H}=dims(); if(!W||!H) return;
    svg.setAttribute('width',W); svg.setAttribute('height',H);
    const {pw,ph,sx,sy}=scales(W,H);
    const pts=o.points;
    const fromPt=o.connectFrom?pts.find(p=>p.id===o.connectFrom):null;
    const pinned=pts.find(p=>p.id===pinnedId);
    let s='';
    // grid
    TICKS.forEach(t=>{ s+=`<line x1="${sx(t)}" y1="${m.t}" x2="${sx(t)}" y2="${m.t+ph}" stroke="#222" stroke-width="1"/>`; });
    TICKS.forEach(t=>{ s+=`<line x1="${m.l}" y1="${sy(t)}" x2="${m.l+pw}" y2="${sy(t)}" stroke="#222" stroke-width="1"/>`; });
    // zero axes
    s+=`<line x1="${sx(0)}" y1="${m.t}" x2="${sx(0)}" y2="${m.t+ph}" stroke="#383838" stroke-width="1"/>`;
    s+=`<line x1="${m.l}" y1="${sy(0)}" x2="${m.l+pw}" y2="${sy(0)}" stroke="#383838" stroke-width="1"/>`;
    // frame
    s+=`<rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="none" stroke="#3a3a3a" stroke-width="1"/>`;
    // ticks + numbers
    TICKS.forEach(t=>{ s+=`<line x1="${sx(t)}" y1="${m.t+ph}" x2="${sx(t)}" y2="${m.t+ph+4}" stroke="#4a4a4a"/>`+
      `<text x="${sx(t)}" y="${m.t+ph+17}" fill="#6f6f6f" font-size="11" font-family="${getFont()}" text-anchor="middle">${t.toFixed(1)}</text>`; });
    TICKS.forEach(t=>{ s+=`<line x1="${m.l-4}" y1="${sy(t)}" x2="${m.l}" y2="${sy(t)}" stroke="#4a4a4a"/>`+
      `<text x="${m.l-9}" y="${sy(t)+4}" fill="#6f6f6f" font-size="11" font-family="${getFont()}" text-anchor="end">${t.toFixed(1)}</text>`; });
    // axis titles
    s+=`<text x="${m.l+pw/2}" y="${H-6}" fill="#8a8a8a" font-size="12" font-family="${getFont()}" text-anchor="middle" letter-spacing="1">${o.axisX}</text>`;
    s+=`<text x="15" y="${m.t+ph/2}" fill="#8a8a8a" font-size="12" font-family="${getFont()}" text-anchor="middle" letter-spacing="1" transform="rotate(-90 15 ${m.t+ph/2})">${o.axisY}</text>`;
    // connection lines
    if(fromPt){ pts.filter(p=>p.id!==fromPt.id).forEach(p=>{ const top=p.tone==="red";
      s+=`<line x1="${sx(fromPt.x)}" y1="${sy(fromPt.y)}" x2="${sx(p.x)}" y2="${sy(p.y)}" stroke="${redAlpha(p.sim!=null?p.sim:0.2)}" stroke-width="${top?1.8:1}"/>`; }); }
    // pinned crosshair
    if(pinned){
      s+=`<line x1="${sx(pinned.x)}" y1="${sy(pinned.y)}" x2="${sx(pinned.x)}" y2="${sy(d0)}" stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>`+
         `<line x1="${sx(pinned.x)}" y1="${sy(pinned.y)}" x2="${m.l}" y2="${sy(pinned.y)}" stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>`+
         `<rect x="${sx(pinned.x)-19}" y="${m.t+ph+1}" width="38" height="15" fill="#000"/>`+
         `<text x="${sx(pinned.x)}" y="${m.t+ph+12}" fill="#fff" font-size="10.5" font-family="${getFont()}" text-anchor="middle">${pinned.x.toFixed(2)}</text>`+
         `<rect x="${m.l-44}" y="${sy(pinned.y)-8}" width="38" height="15" fill="#000"/>`+
         `<text x="${m.l-25}" y="${sy(pinned.y)+3}" fill="#fff" font-size="10.5" font-family="${getFont()}" text-anchor="middle">${pinned.y.toFixed(2)}</text>`;
    }
    // points
    pts.forEach(p=>{
      const isDrag=p.id===o.draggableId; const r=p.r||(p.tone==="gray"?5:6.5);
      if(isDrag||p.tone==="red") s+=`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${r+5}" fill="none" stroke="${strokeFor(p)}" stroke-width="1" opacity="0.4"/>`;
      s+=`<g class="pt" data-id="${p.id}" style="cursor:${isDrag?'grab':(o.onPin?'pointer':'default')}">`+
         `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${r}" fill="${fillFor(p)}" stroke="${strokeFor(p)}" stroke-width="1"/>`+
         (p.label?`<text x="${sx(p.x)+r+6}" y="${sy(p.y)+4}" fill="${p.tone==='gray'?'#9a9a9a':'#e6e6e6'}" font-size="13" font-family="${getSans()}">${p.label}</text>`:'')+
         `</g>`;
    });
    svg.innerHTML=s;
    bindPts();
  }
  function getFont(){ return "ui-monospace,'SF Mono',Menlo,Consolas,monospace"; }
  function getSans(){ return "-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"; }

  function bindPts(){
    svg.querySelectorAll('.pt').forEach(g=>{
      const id=g.dataset.id; const p=o.points.find(pp=>pp.id===id);
      g.addEventListener('mouseenter', e=>{ showTip(p, e); });
      g.addEventListener('mousemove', e=>{ moveTip(e); });
      g.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
      if(o.onPin) g.addEventListener('click', e=>{ pinnedId = (id===pinnedId?null:id); o.onPin(pinnedId); draw(); });
      if(id===o.draggableId) g.addEventListener('mousedown', e=>{ e.preventDefault(); dragging=true; });
    });
  }
  function showTip(p,e){
    let html=`<div class="coord">${p.id} · (${p.x.toFixed(2)}, ${p.y.toFixed(2)})</div>`;
    if(p.full) html+=`<div class="txt">${p.full}</div>`;
    if(p.sim!=null) html+=`<div class="coord">cosine ≈ ${p.sim.toFixed(3)}</div>`;
    tip.innerHTML=html; tip.style.display='block'; moveTip(e);
  }
  function moveTip(e){
    const r=host.getBoundingClientRect();
    let x=e.clientX-r.left+14, y=e.clientY-r.top-10;
    if(x+260>r.width) x=r.width-260;
    tip.style.left=x+'px'; tip.style.top=Math.max(6,y)+'px';
  }
  // drag
  function onMove(e){ if(!dragging||!o.onDrag) return; const d=toData(e.clientX,e.clientY); o.onDrag(d.x,d.y); }
  function onUp(){ dragging=false; }
  if(o.draggableId){ window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp); }

  const ro=new ResizeObserver(draw); ro.observe(host);
  draw();
  return {
    update(newOpts){ Object.assign(o,newOpts); if(newOpts && 'pinnedId' in newOpts) pinnedId=newOpts.pinnedId; draw(); },
    setPinned(id){ pinnedId=id; draw(); },
    redraw:draw,
    destroy(){ ro.disconnect(); if(o.draggableId){ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); } }
  };
}

/* ---- CoGraph: radial co-occurrence (4a) ----
   DISTANCE encodes strength: stronger co-occurrence (higher s) sits CLOSER to center.
   radius = Rmax - s*(Rmax - Rmin). Angular placement unchanged (no label overlap).
   Line width kept as a redundant secondary cue; numeric label kept on each spoke. */
function CoGraph(host, center, neighbors, tone){
  let firstDraw=true;
  function draw(animate){
    const W=host.clientWidth||300, H=host.clientHeight||300; if(!W||!H) return;
    const cx=W/2, cy=H/2, n=neighbors.length;
    // radius band: keep closest clear of the center node (r=26) and farthest inside the panel
    const reach=Math.min(W,H)*0.5;
    const Rmin=46;                                   // strongest neighbor distance (just outside center node)
    const Rmax=Math.max(Rmin+34, Math.min(reach-26, reach*0.92)); // weakest neighbor distance, clamped inside panel
    const radiusOf=s=>Rmax - Math.max(0,Math.min(1,s))*(Rmax-Rmin); // s=1 -> Rmin (near), s=0 -> Rmax (far)
    const centerColor= tone==="blue"?"#1e6fff":"#ff4740";
    let s='';
    // faint reference rings at s=1 (near) and s=0 (far) so the distance scale reads
    s+=`<circle cx="${cx}" cy="${cy}" r="${Rmin}" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="2 4"/>`+
       `<circle cx="${cx}" cy="${cy}" r="${Rmax}" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="2 4"/>`;
    neighbors.forEach((nb,i)=>{ const ang=(-90+(360/n)*i)*Math.PI/180; const R=radiusOf(nb.s); const nx=cx+Math.cos(ang)*R, ny=cy+Math.sin(ang)*R;
      const len=R;
      s+=`<line class="cospoke" data-len="${len}" x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${redAlpha(nb.s)}" stroke-width="${1+nb.s*5}" stroke-linecap="round"${animate?` stroke-dasharray="${len}" stroke-dashoffset="${len}"`:''}/>`+
         `<text class="conode" x="${(cx+nx)/2}" y="${(cy+ny)/2-4}" fill="#6f6f6f" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle"${animate?' opacity="0"':''}>${nb.s.toFixed(2)}</text>`; });
    neighbors.forEach((nb,i)=>{ const ang=(-90+(360/n)*i)*Math.PI/180; const R=radiusOf(nb.s); const nx=cx+Math.cos(ang)*R, ny=cy+Math.sin(ang)*R;
      s+=`<g class="conode"${animate?' opacity="0"':''}><circle cx="${nx}" cy="${ny}" r="${4+nb.s*2}" fill="#1a1a1a" stroke="#555" stroke-width="1"/>`+
         `<text x="${nx}" y="${ny-11}" fill="#c3c3c3" font-size="13" font-family="-apple-system,'PingFang SC',sans-serif" text-anchor="middle">${nb.w}</text></g>`; });
    s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="#000" stroke="${centerColor}" stroke-width="1.5"/>`+
       `<text x="${cx}" y="${cy+5}" fill="#fff" font-size="14" font-family="-apple-system,'PingFang SC',sans-serif" font-weight="600" text-anchor="middle">${center}</text>`;
    host.innerHTML=`<svg width="${W}" height="${H}" style="display:block">${s}</svg>`;
    if(animate){
      // smooth eased entrance: spokes grow from center outward, then nodes/labels fade in
      requestAnimationFrame(()=>{
        host.querySelectorAll('.cospoke').forEach(l=>{ l.style.transition='stroke-dashoffset .6s cubic-bezier(.22,.61,.36,1)'; l.style.strokeDashoffset='0'; });
        setTimeout(()=>{ host.querySelectorAll('.conode').forEach(el=>{ el.style.transition='opacity .4s ease'; el.setAttribute('opacity','1'); }); }, 360);
      });
    }
  }
  const ro=new ResizeObserver(()=>draw(false)); ro.observe(host); // redraws on resize without re-animating
  draw(firstDraw); firstDraw=false;
}

       <p>今天大量 AI 问答、客服、搜索的背后，用的是一套叫 <span class="hl">RAG(检索增强生成)</span> 的办法：先去一个知识库里<strong>查到相关资料</strong>，再带着资料<strong>回答</strong>。这能让模型少编瞎话(幻觉)、知识能随时更新、答案还能溯源。</p>
       <p>难点在于：计算机并不"读懂"文字，它只会算数字。那么——一句话的<strong>意思</strong>，是怎么变成数字、被存起来、又被一个问题精确找到的?</p>

     <div class="canvas__corner tl" style="z-index:6">dim: ${D.DIM} → 2D 投影(高维压扁的示意)</div>
     <div class="canvas__corner tr" style="z-index:6">coord: (${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}) · 确定可复现</div>
     <div id="lrow" style="flex:0 0 auto;max-height:64px;opacity:1;overflow:hidden;transition:max-height .6s cubic-bezier(.22,.61,.36,1),opacity .6s;padding:16px 30px 4px">
       <div class="heatrow__label" style="margin-bottom:6px"><span class="name"><span class="tag">${h.aName}</span>${sentenceOf(h.aName)}</span><span>${D.DIM} 维 → 收缩为一个点</span></div>
       <div style="width:100%"><canvas class="heat-canvas" id="heatL" style="height:28px"></canvas></div></div>
     <div style="flex:1;min-height:0;padding:8px 8px 4px"><div class="scatter-host" id="lscatter"></div></div>
   </div>`;
   requestAnimationFrame(()=> paintHeat(document.getElementById('heatL'), h.a, 28));
   const point={ id:h.aName, x:pt.x, y:pt.y, label:h.aName, tone:"red", full:sentenceOf(h.aName) };
   activeScatter=Scatter(el.querySelector('#lscatter'), { points:[point], pinnedId:null });
   after(800, ()=>{ const r=document.getElementById('lrow'); if(r){ r.style.maxHeight='0'; r.style.opacity='0'; r.style.padding='0 30px'; } if(activeScatter) activeScatter.setPinned(h.aName); });
 },

 /* -------- step 5: index (heat matrix + 2D map), data-driven -------- */
 index(el){
   const ids=D.chunks.map(c=>c.id);
   el.innerHTML=`<div class="canvas fade-step" style="display:flex">
     <div class="canvas__corner tl" style="z-index:6">vectors: 12 × ${D.DIM} · 单色红编码分量</div>
     <div class="canvas__corner tr" style="z-index:6">高维压扁的 2D 示意</div>
     <div style="position:absolute;inset:0;padding:30px 22px 16px;display:flex">
       <div class="idx-wrap">
         <div class="idx-col" style="flex:0 0 300px">
           <div class="idx-col__head">向量热力矩阵 · 12 × ${D.DIM}</div>
           <div class="matrix" id="matrix">${ids.map(id=>
             `<div class="matrix__row"><span class="matrix__id">${id}</span><canvas class="matrix__cells" id="mx-${id}"></canvas></div>`).join('')}</div>
         </div>
         <div style="width:1px;background:#2a2a2a"></div>
         <div class="idx-col" style="flex:1">
           <div class="idx-col__head">2D 意思地图 · 12 点(悬停看句子 · 点击钉坐标)</div>
           <div style="flex:1;min-height:0"><div class="scatter-host" id="idxscatter"></div></div>
         </div>
       </div></div></div>`;
   // paint each chunk's vector as a heat row (data-driven: vecFor(text))
   requestAnimationFrame(()=> ids.forEach(id=>{ const cv=document.getElementById('mx-'+id); if(cv) paintHeat(cv, D.vecFor(sentenceOf(id), D.DIM), 15); }));
   const points=ids.map(id=>({ id, x:D.coords2d[id].x, y:D.coords2d[id].y, label:id, tone:"gray", full:sentenceOf(id) }));
   let pinned=null;
   activeScatter=Scatter(el.querySelector('#idxscatter'), { points, onPin:id=>{pinned=id;} });
 },

 /* -------- step 6: query → tokenize → vectorize → coord -------- */
 query(el){
   el.innerHTML=`<div class="canvas fade-step">
     <div class="canvas__corner tl">query embed · 与语料同一套嵌入</div>
     <div class="canvas__corner tr">dim: ${D.DIM}</div>
     <div class="pipe">
       <div class="pipe__box" id="p0" style="max-width:560px"><span class="bh">你的问题 · 真实</span>${D.question}</div>
       <div class="pipe__row">
         <div class="pipe__box" id="p1"><span class="bh">分词</span>雷峰塔 / 是 / 什么 / 时候 / 倒掉 / 又 / 重建</div>
         <span class="pipe__arrow" id="a1">→</span>
         <div class="pipe__box" id="p2"><span class="bh">向量化 · ${D.DIM} 维(示意)</span>[0.79, -0.18, 0.60, …]</div>
         <span class="pipe__arrow" id="a2">→</span>
         <div class="pipe__box qcoord" id="p3"><span class="bh">问题坐标</span>● (${D.questionCoord.x.toFixed(2)}, ${D.questionCoord.y.toFixed(2)}) · 蓝色点</div>
       </div></div></div>`;
   ['p0','p1','a1','p2','a2','p3'].forEach((id,i)=> after(200+i*340, ()=>{ const e=document.getElementById(id); if(e) e.classList.add('in'); }));
 },

 /* -------- step 7: retrieval — draggable question, live re-rank (v4 logic) -------- */
 retrieval(el){
   const ids=D.chunks.map(c=>c.id);
   if(!q7) q7={ q:{x:D.questionCoord.x, y:D.questionCoord.y} };
   const MAXD=Math.hypot(2.3,2.3); // domain span ~[-1.15,1.15]
   const sim2d=(c)=> Math.max(0, 1 - Math.hypot(c.x-q7.q.x, c.y-q7.q.y)/MAXD);
   el.innerHTML=`<div class="canvas fade-step" style="display:flex;flex-direction:column">
     <div class="canvas__corner tl" style="z-index:6">retrieval · 2D 距离实时计算</div>
     <div class="canvas__corner tr" style="z-index:6">高维压扁的 2D 示意</div>
     <div style="position:absolute;inset:0;padding:30px 22px 14px;display:flex;gap:18px">
       <div style="flex:1;min-height:0;display:flex;flex-direction:column">
         <div class="idx-col__head">2D 意思地图 · 拖动蓝色“问题”点</div>
         <div style="flex:1;min-height:0"><div class="scatter-host" id="rscatter"></div></div>
         <div class="maphint" style="margin-top:8px">拖动“问题”点，看排名实时变化 <span class="reset-chip" id="rreset">↺ 复位</span></div>
       </div>
       <div style="width:1px;background:#2a2a2a"></div>
       <div style="flex:0 0 320px;display:flex;flex-direction:column;min-height:0">
         <div class="idx-col__head">相似度排名 · 降序(2D 距离 → 相似度)</div>
         <div class="rank" id="rank" style="overflow-y:auto"></div>
       </div></div></div>`;
   const host=el.querySelector('#rscatter'); const rankEl=el.querySelector('#rank');
   function compute(){
     const scored=ids.map(id=>{ const c=D.coords2d[id]; return {id, x:c.x, y:c.y, s:sim2d(c)}; }).sort((a,b)=>b.s-a.s);
     const top=scored[0].id; const maxS=scored[0].s||1;
     const points=scored.map(d=>({ id:d.id, x:d.x, y:d.y, label:d.id, tone:d.id===top?"red":"gray", sim:d.s, full:sentenceOf(d.id) }));
     points.push({ id:"Q", x:q7.q.x, y:q7.q.y, label:"问题", tone:"blue" });
     return {scored, top, maxS, points};
   }
   function renderRank(scored, top, maxS){
     rankEl.innerHTML=scored.map(d=>`<div class="rank__row ${d.id===top?'is-top':''}">
       <span class="rank__lbl">${d.id} · ${sentenceOf(d.id).slice(0,8)}…</span>
       <span class="rank__track"><span class="rank__fill" style="width:${(d.s/maxS)*100}%"></span></span>
       <span class="rank__p">${d.s.toFixed(2)}</span></div>`).join('');
   }
   function setReadout(maxS){ const v=document.querySelector('.readouts .readout:last-child .readout__v'); if(v) v.textContent=maxS.toFixed(2); }
   let st=compute();
   activeScatter=Scatter(host, { points:st.points, connectFrom:"Q", draggableId:"Q",
     onDrag:(x,y)=>{ q7.q.x=x; q7.q.y=y; const s=compute(); activeScatter.update({points:s.points}); renderRank(s.scored,s.top,s.maxS); setReadout(s.maxS); },
     onPin:()=>{} });
   renderRank(st.scored, st.top, st.maxS); setReadout(st.maxS);
   el.querySelector('#rreset').addEventListener('click', ()=>{ q7.q.x=D.questionCoord.x; q7.q.y=D.questionCoord.y; const s=compute(); activeScatter.update({points:s.points}); renderRank(s.scored,s.top,s.maxS); setReadout(s.maxS); });
 },

 /* -------- step 8: generation — prompt assembly + streamed answer -------- */
 generation(el){
   el.innerHTML=`<div class="canvas fade-step">
     <div class="canvas__corner tl">prompt assembly · RAG</div>
     <div class="canvas__corner tr">context: C6 · cosine 0.87(示意)</div>
     <div class="gen">
       <div class="asm">
         <div class="blk sys" id="b0"><span class="bh">[系统]</span>你是西湖知识助手，只根据提供的资料回答，不要编造。</div>
         <div class="blk ctx" id="b1"><span class="bh">[检索到的资料 · C6]</span>${sentenceOf("C6")}</div>
         <div class="blk q" id="b2"><span class="bh">[问题]</span>${D.question}</div>
       </div>
       <div class="answer-box" id="ansbox"><span id="anst"></span><span class="cur" id="anscur">▍</span></div>
       <div class="rag-note" id="ragnote" style="opacity:0;transition:opacity .5s">这套“先检索、再回答”的办法，就叫 <b>RAG</b>。</div>
     </div></div>`;
   ['b0','b1','b2'].forEach((id,i)=> after(200+i*420, ()=>{ const e=document.getElementById(id); if(e) e.classList.add('in'); }));
   after(1700, ()=>{ const box=document.getElementById('ansbox'); if(box) box.classList.add('in'); stream(D.answer); });
 },
};

function stream(text){
  const el=document.getElementById('anst'), cur=document.getElementById('anscur');
  let i=0;
  const tick=()=>{ if(i>=text.length){ if(cur) cur.style.display='none'; const n=document.getElementById('ragnote'); if(n) n.style.opacity='1'; return; }
    if(el) el.textContent+=text[i++]; timers.push(setTimeout(tick,110)); };
  tick();
}

/* ====================================================================
   SHELL + NAV (vanilla port of app.jsx)
   ==================================================================== */
const MAIN=8;
let idx=0;
const root=document.getElementById('root');

function subsOfStep(sn){ return STEPS.filter(s=>s.stepOf===sn); }

function build(){
  root.innerHTML=`<div class="app">
    <div class="topbar">
      <div class="brand"><span class="brand__mark">RAG · 01</span><span class="brand__name">慢读向量化</span><span class="brand__sub">/ 一段文字如何变成数字</span></div>
      <div class="topbar__spacer"></div>
      <div class="stepind" id="stepind"></div>
      <div class="readouts" id="readouts"></div>
      <div class="livetoggle" title="后续接入真实嵌入 + 真实模型"><span class="dot"></span>LIVE<span class="pill">关 · 预留</span></div>
    </div>
    <div class="body">
      <aside class="rail" id="rail"></aside>
      <main class="stage">
        <div class="stage__head"><span class="stage__label" id="stagelabel"></span>
          <div class="stage__meta" id="stagemeta"></div></div>
        <div id="stagebody" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
      </main>
    </div>
    <div class="footer">
      <button class="nav-btn" id="prevBtn"><span class="k">←</span> 上一步</button>
      <button class="nav-btn ghost" id="replayBtn">↺ 重播本步</button>
      <span class="watermark author-trigger" tabindex="0" title="作者 Sparker"><span class="by">by</span><span class="dot"></span><span class="nm">Sparker</span>${authorPop()}</span>
      <div class="progress" id="progress"></div>
      <div class="seglabel" id="seglabel"></div>
      <button class="nav-btn primary" id="nextBtn">下一步 <span class="k">→</span></button>
    </div>
  </div>`;
  document.getElementById('prevBtn').onclick=()=>go(idx-1);
  document.getElementById('nextBtn').onclick=()=>go(idx+1);
  document.getElementById('replayBtn').onclick=()=>render();
  render();
}

function render(){
  clearTimers();
  if(activeScatter && activeScatter.destroy){ activeScatter.destroy(); activeScatter=null; }
  const step=STEPS[idx];
  const isCover=!!step.cover;
  const curSubs=subsOfStep(step.stepOf);
  const curSubIdx=curSubs.findIndex(s=>s.num===step.num);

  // step indicator
  document.getElementById('stepind').innerHTML= isCover
    ? `<span style="color:var(--blue)">导言 · INTRODUCTION</span><span>· 共 ${MAIN} 步</span>`
    : `<span>第 <b>${step.stepOf}</b> / ${MAIN} 步</span>`+
      (curSubs.length>1?`<span style="color:var(--blue)">· ${step.num.toUpperCase()}（${curSubIdx+1}/${curSubs.length}）</span>`:'');
  // readouts
  document.getElementById('readouts').innerHTML=step.readouts.map(r=>
    `<div class="readout"><span class="readout__k">${r.k}</span><span class="readout__v">${r.v}</span></div>`).join('');
  // rail
  if(isCover){
    document.getElementById('rail').innerHTML=
      `<div class="rail__kicker"><span class="num">导言</span><span class="bar"></span><span>INTRODUCTION</span></div>
       <h1 class="rail__title">从一个问题开始<span class="en">How does it know the answer?</span></h1>
       <p class="rail__lead">这是一次<b>放慢的导览</b>——看清一句话如何变成数字，又如何被找到。</p>
       <p class="rail__body">右侧是导言。点 <strong>「开始 →」</strong>(或下一步)进入第 1 步：原文 · 知识库。全程共 <strong>8 步</strong>，"向量化"拆成 4 个子步。</p>
       <div class="rail__foot"><div class="note"><span class="tag">提示</span>每一步右栏(或旁白下方)都有一块「实际情况 · REALITY」补充框，讲背后的真实工程与数学，愿意深入再看。</div></div>`;
  } else {
    document.getElementById('rail').innerHTML=
      `<div class="rail__kicker"><span class="num">STEP ${step.num.toUpperCase()}</span><span class="bar"></span><span>${step.kicker}</span></div>
       <h1 class="rail__title">${step.title}<span class="en">${step.en}</span></h1>
       <p class="rail__lead">${step.lead}</p>
       ${step.quote?`<div class="rail__quote">${step.quote}</div>`:''}
       ${step.body?`<p class="rail__body">${step.body}</p>`:''}
       ${step.reality?`<div class="reality"><div class="reality__lab"><span class="sq"></span>实际情况 <span class="en">· REALITY</span></div><div class="reality__body">${step.reality}</div></div>`:''}
       <div class="rail__foot"><div class="note">${step.note}</div></div>`;
  }
  // stage head
  document.getElementById('stagelabel').textContent= isCover ? '导言 · INTRODUCTION' : `${step.kicker} · ${step.title}`;
  document.getElementById('stagemeta').innerHTML= isCover ? `<span>RAG · 检索增强生成</span>`
    : (step.stepOf<=3 || step.stepOf===6 || step.stepOf===8
      ? `<span>含真实内容</span>` : `<span style="color:var(--ink-faint)">※ 含示意数值（界面已标注）</span>`);
  // footer
  document.getElementById('prevBtn').disabled = idx===0;
  const nb=document.getElementById('nextBtn'); nb.disabled = idx===STEPS.length-1;
  document.getElementById('seglabel').innerHTML= isCover ? `导言 · <b>0</b>` : `${step.title} · <b>${step.num.toUpperCase()}</b>`;
  let prog='';
  for(let sn=1;sn<=MAIN;sn++){
    const done=sn<step.stepOf, isCur=sn===step.stepOf;
    let fill = done?1 : (isCur ? (curSubs.length>1?(curSubIdx+1)/curSubs.length:1) : 0);
    prog+=`<div class="seg ${done?'done':''}" data-sn="${sn}" title="第 ${sn} 步"><div class="fill" style="transform:scaleX(${fill})"></div></div>`;
  }
  document.getElementById('progress').innerHTML=prog;
  document.querySelectorAll('#progress .seg').forEach(seg=>{
    seg.onclick=()=>{ const sn=+seg.dataset.sn; const t=STEPS.findIndex(s=>s.stepOf===sn); if(t>=0) go(t); };
  });
  // stage body
  const stageBody=document.getElementById('stagebody');
  stageBody.innerHTML='';
  STAGES[step.stage](stageBody);
}

function go(n){ const v=Math.max(0,Math.min(STEPS.length-1,n)); if(v!==idx){ idx=v; render(); } }

/* screenshot hooks */
function goToScreen(id){ const key=String(id)==='cover'?'0':String(id); const i=STEPS.findIndex(s=>s.num===key); if(i>=0){ idx=i; render(); } }
function goToStep(n){ goToScreen(String(n)); }   // '0'/'cover' for intro; main step 1..8; for step 4 use '4a'..'4d'
function setQuestion(x,y){ if(STEPS[idx].num!=='7') return; if(!q7) q7={q:{}}; q7.q.x=x; q7.q.y=y; render(); }
window.goToScreen=goToScreen; window.goToStep=goToStep; window.setQuestion=setQuestion;
window.nextStep=()=>go(idx+1); window.prevStep=()=>go(idx-1); window.replayStep=()=>render();

// keyboard
window.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') go(idx+1); else if(e.key==='ArrowLeft') go(idx-1); else if(e.key==='r'||e.key==='R') render(); });

build();
</script>
</body>
</html>
